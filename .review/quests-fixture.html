<!doctype html>
<!-- Structural stand-in for the rebuilt /quests table. Same classes as
     app/quests/QuestsExplorer.tsx inside the same AppShell frame, compiled with
     the project's real Tailwind output, so sticky offsets, the xl two-column
     split and the row-wide hit target can be measured before the orchestrator
     rebuilds the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./quests-fixture.css">
<style>
  :root { --font-display-family: serif; --font-sans-family: system-ui; --font-mono-family: monospace; }
</style>
</head>
<body>
<div class="min-h-dvh flex flex-col">
  <header class="sticky top-0 z-30 h-14 border-b border-line bg-bg/85 backdrop-blur-md">
    <div class="h-full max-w-[1400px] mx-auto flex items-center px-4 sm:px-6 md:px-8">app header</div>
  </header>
  <div class="flex flex-1 w-full">
    <aside class="hidden md:block md:sticky md:top-14 md:self-start md:h-[calc(100dvh-3.5rem)] md:w-56 md:flex-shrink-0 md:border-r md:border-line">nav</aside>
    <main class="flex-1 min-w-0 px-4 sm:px-6 md:px-8 py-6 md:py-8 pb-24 md:pb-8">
      <div class="mx-auto w-full max-w-[1400px]">
        <div class="space-y-6">
          <div style="height:520px" class="border border-line rounded-lg grid place-items-center text-ink-3">cards + do next stand-in</div>

          <div id="section" class="scroll-mt-16">
            <p class="mb-2 text-[11px] text-ink-3">Tap a row to open that quest on the RuneScape Wiki in a new tab.</p>

            <div id="quest-filters" class="sticky top-14 z-10 -mt-1 pt-1 bg-bg scroll-mt-16">
              <div class="pb-2 space-y-2 border-b border-line sm:border-b-0">
                <div class="flex items-center gap-2.5">
                  <div class="relative flex-1 min-w-0">
                    <input type="search" placeholder="Search quests…" class="w-full h-11 pl-9 pr-11 rounded-lg bg-bg-surface border border-line text-sm text-ink placeholder:text-ink-3">
                  </div>
                  <p class="shrink-0 font-mono tabular text-[11px] text-ink-3">363 quests</p>
                </div>
                <div class="overflow-x-auto lg:overflow-visible">
                  <div class="flex items-center gap-2 min-w-max lg:min-w-0 lg:flex-wrap [&>[role=group]]:flex-nowrap [&>[role=group]]:max-w-none lg:[&>[role=group]]:flex-wrap">
                    <div role="group" class="inline-flex flex-wrap items-center gap-1 p-1 rounded-lg bg-bg-surface border border-line max-w-full">
                      <button class="rounded-md font-mono uppercase tracking-wider whitespace-nowrap h-11 px-3.5 text-[11px] sm:h-8 sm:px-3 bg-bg-raised text-ink">All<span class="ml-1.5 text-ink-3 tabular">363</span></button>
                      <button class="rounded-md font-mono uppercase tracking-wider whitespace-nowrap h-11 px-3.5 text-[11px] sm:h-8 sm:px-3 text-ink-3">One<span class="ml-1.5 text-ink-3 tabular">106</span></button>
                      <button class="rounded-md font-mono uppercase tracking-wider whitespace-nowrap h-11 px-3.5 text-[11px] sm:h-8 sm:px-3 text-ink-3">Both<span class="ml-1.5 text-ink-3 tabular">34</span></button>
                      <button class="rounded-md font-mono uppercase tracking-wider whitespace-nowrap h-11 px-3.5 text-[11px] sm:h-8 sm:px-3 text-ink-3">Started<span class="ml-1.5 text-ink-3 tabular">5</span></button>
                      <button class="rounded-md font-mono uppercase tracking-wider whitespace-nowrap h-11 px-3.5 text-[11px] sm:h-8 sm:px-3 text-ink-3">None<span class="ml-1.5 text-ink-3 tabular">218</span></button>
                    </div>
                    <button class="shrink-0 inline-flex items-center gap-1.5 h-11 sm:h-10 px-3 rounded-lg border text-[11px] font-mono uppercase tracking-wider border-line text-ink-3">Members only</button>
                  </div>
                </div>
                <p class="sm:hidden flex items-center gap-3">
                  <span class="inline-flex items-center gap-1.5"><span class="grid place-items-center w-5 h-5 rounded-full border font-mono text-[10px] font-bold text-soul-bright border-soul/40">D</span><span class="text-[11px] text-ink-3">Decxus</span></span>
                  <span class="inline-flex items-center gap-1.5"><span class="grid place-items-center w-5 h-5 rounded-full border font-mono text-[10px] font-bold text-prayer-bright border-prayer/40">S</span><span class="text-[11px] text-ink-3">Soclopata</span></span>
                </p>
              </div>

              <div id="thead" class="hidden sm:grid xl:grid-cols-2 bg-bg-surface border border-line rounded-t-lg text-[10px] uppercase tracking-[0.14em] font-mono text-ink-3">
                <div class="grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[minmax(0,1fr)_2.75rem_2rem_3rem_auto] lg:grid-cols-[minmax(0,1fr)_2.75rem_2rem_2rem_3rem_auto] items-center gap-x-2.5 px-4 py-2">
                  <span>Quest</span><span>Diff</span><span class="hidden lg:block">Type</span><span class="text-right">QP</span><span>Start</span>
                  <span class="flex items-center justify-end gap-1.5"><span class="w-6 text-center text-soul-bright">D</span><span class="w-6 text-center text-prayer-bright">S</span></span>
                </div>
                <div id="thead2" class="hidden xl:grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[minmax(0,1fr)_2.75rem_2rem_3rem_auto] lg:grid-cols-[minmax(0,1fr)_2.75rem_2rem_2rem_3rem_auto] items-center gap-x-2.5 px-4 py-2 border-l border-line">
                  <span>Quest</span><span>Diff</span><span class="hidden lg:block">Type</span><span class="text-right">QP</span><span>Start</span>
                  <span class="flex items-center justify-end gap-1.5"><span class="w-6 text-center text-soul-bright">D</span><span class="w-6 text-center text-prayer-bright">S</span></span>
                </div>
              </div>
            </div>

            <div class="bg-bg-surface border border-line rounded-lg sm:border-t-0 sm:rounded-t-none overflow-hidden">
              <ul id="rows" class="xl:grid xl:grid-cols-2"></ul>
              <div class="flex flex-wrap items-center justify-between gap-3 px-3 sm:px-4 py-3">
                <p class="font-mono tabular text-[11px] text-ink-3">Showing 60 of 363</p>
                <div class="flex flex-wrap items-center gap-2">
                  <button class="inline-flex items-center h-10 px-3.5 rounded-lg border border-line-strong text-[11px] font-mono uppercase tracking-wider text-ink-2">Show 60 more</button>
                  <button class="inline-flex items-center h-10 px-3.5 rounded-lg border border-line text-[11px] font-mono uppercase tracking-wider text-ink-3">All 363</button>
                  <a href="#quest-filters" class="inline-flex items-center gap-1.5 h-10 px-3 rounded-lg text-[11px] font-mono uppercase tracking-wider text-ink-3">Filters</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
const TITLES = ['A Void Dance','Dishonour among Thieves','Cook\'s Assistant','The Firemaker\'s Curse','A Fairy Tale III - Battle at Orks Rift','Broken Home','Buyers and Cellars','Rune Mysteries','While Guthix Sleeps','Missing My Mummy','One Small Favour','Plague\'s End'];
const ROW = 'group relative grid grid-cols-[minmax(0,1fr)_auto] sm:grid-cols-[minmax(0,1fr)_2.75rem_2rem_3rem_auto] lg:grid-cols-[minmax(0,1fr)_2.75rem_2rem_2rem_3rem_auto] items-center gap-x-2.5 px-3 sm:px-4 py-2.5 border-b border-line/60 hover:bg-bg-raised/40 transition-colors xl:[&:nth-child(even)]:border-l xl:[&:nth-child(even)]:border-line';
const ul = document.getElementById('rows');
ul.innerHTML = Array.from({length: 60}, (_, i) => {
  const t = TITLES[i % TITLES.length];
  return `<li class="${ROW}">
    <a href="https://runescape.wiki/w/x" target="_blank" rel="noopener noreferrer" aria-label="${t} — RuneScape Wiki" title="${t} — RuneScape Wiki" class="absolute inset-0 rounded-md"></a>
    <div class="min-w-0">
      <div class="flex items-center gap-1 text-sm transition-colors text-ink">
        <span class="truncate">${t}</span>
        <svg width="11" height="11" class="shrink-0 text-ink-3" aria-hidden="true"><rect width="11" height="11" fill="currentColor"/></svg>
      </div>
      <div class="sm:hidden mt-1 flex items-center gap-2.5">
        <span class="font-mono text-[11px] leading-none whitespace-nowrap"><span class="text-warn">★★</span><span class="text-ink-faint">☆☆☆</span></span>
        <span class="font-mono tabular text-[10px] text-ink-3">2 QP</span>
        <span class="font-mono text-[10px] tracking-wider text-ink-3">P2P</span>
        <span class="font-mono text-[10px] uppercase tracking-wider text-success">Ready</span>
      </div>
    </div>
    <span class="hidden sm:block"><span class="font-mono text-[11px] leading-none whitespace-nowrap"><span class="text-warn">★★</span><span class="text-ink-faint">☆☆☆</span></span></span>
    <span class="hidden lg:block"><span class="font-mono text-[10px] tracking-wider text-ink-3">P2P</span></span>
    <span class="hidden sm:block text-right font-mono tabular text-xs text-ink-3">2</span>
    <span class="hidden sm:block"><span class="font-mono text-[10px] uppercase tracking-wider text-success">Ready</span></span>
    <span class="relative flex items-center justify-end gap-1.5">
      <span role="img" aria-label="Decxus: completed" title="Decxus: completed" class="grid place-items-center w-6 h-6 rounded-full font-mono text-[10.5px] font-bold text-soul-bright bg-bg-raised">D</span>
      <span role="img" aria-label="Soclopata: not started" title="Soclopata: not started" class="grid place-items-center w-6 h-6 rounded-full font-mono text-[10.5px] font-bold text-ink-3">S</span>
    </span>
  </li>`;
}).join('');
</script>
</body>
</html>
